<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="tahnkyou.html" method="post">
        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" name="name" id="" placeholder="Enter name"></td>
            </tr>
            <tr>
                <td>Surname</td>
                <td><input type="text" name="sname" id=""></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="" id=""></td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel" name="" id=""></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="" id=""></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>Male <input type="radio" value="male" name="gender" id="">Female <input type="radio" value="female" name="gender" id=""></td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>Criicket <input type="checkbox" name="hobby" value="cricket" id="">Dancing <input type="checkbox" value="dancing" name="hobby" id=""></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea name="add" id="" rows="5" cols="20"></textarea></td>
            </tr>
            <tr>
                <td>City</td>
                <td><select name="City" id="">
                    <optgroup label="Gujarat">
                    <option value="ahm">Ahmedabad</option>
                    <option value="st">Surat</option>
                    <option value="baroda">Vadodara</option>
                    <option value="rajkot">Rajkot</option>
                    <option value="bhavnagar">Bhavnagar</option>
                </optgroup>
                <optgroup label="Maharashtra" disabled>
                    <option value="mumbai">Mumbai</option>
                    <option value="pune">Pune</option>
                    <option value="nashik">Nashik</option>
                    <option value="kolhapur">Kolhapur</option>
                    <option value="aurangabad">Aurangabad</option>
                </optgroup>
                </select></td>
            </tr>
            <tr>
                <td>DOB</td>
                <!-- <td><input type="date" name="" id=""></td> -->
                 <!-- <td><input type="datetime-local" name="" id=""></td> -->
                  <!-- <td><input type="month" name="" id=""></td> -->
                   <!-- <td><input type="time" name="" id=""></td> -->
                    <!-- <td><input type="week" name="" id=""></td> -->
            </tr>
            <tr>
                <td>Attach File</td>
                <td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td><input type="submit" value="submit" name="" id=""></td>
            </tr>
        </table>
    </form>
    
</body>
</html>
